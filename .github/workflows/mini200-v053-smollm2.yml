name: Mini-200 V0.5.4 Real SmolLM2 Reasoning

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mini200_ci/**'
      - '.github/workflows/mini200-v053-smollm2.yml'

permissions:
  actions: read
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      STEPS: '500'
      GSM_GEN_N: '20'
      GSM_NLL_N: '80'
      MMLU_N: '100'
      LR: '0.00012'
      MODEL_ID: 'HuggingFaceTB/SmolLM2-135M-Instruct'
      INIT_SIDECAR: 'prev_artifact/mini200_ci_out/sidecar_fp16.pt'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download V0.5.3 500-step sidecar
        uses: actions/download-artifact@v4
        with:
          name: mini200-v053-results-3
          path: mini200_ci/prev_artifact
          run-id: 34258096613
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install -U pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<5' 'datasets>=3,<5' 'accelerate>=1,<2' 'safetensors>=0.4' 'huggingface_hub>=0.28'
      - name: Run V0.5.4 actual SmolLM2 experiment
        working-directory: mini200_ci
        run: |
          python run_experiment_v054.py 2>&1 | tee run_v054.log
      - name: Upload V0.5.4 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini200-v054-results-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1
          path: |
            mini200_ci/run_v054.log
            mini200_ci/mini200_ci_out_v054/results_v054.json
            mini200_ci/mini200_ci_out_v054/sidecar_v054_fp16.pt
