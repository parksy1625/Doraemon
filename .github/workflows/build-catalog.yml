name: Build gadget catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_catalog.py'
      - 'data/gadgets.seed.json'
      - '.github/workflows/build-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build master catalog
        run: python scripts/build_catalog.py
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- data/master.json; then
            echo 'No catalog changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/master.json
          git commit -m 'Update generated gadget catalog'
          git push
