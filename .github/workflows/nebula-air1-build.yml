name: Build Nebula Air 1 Mod

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nebula-air1-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download Nebula 3.8.1 XAPK
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 --retry-delay 5 \
            -A "Mozilla/5.0" \
            "https://d.apkpure.net/b/XAPK/ai.nreal.nebula.universal?version=latest" \
            -o Nebula_3.8.1_original.xapk
          unzip -t Nebula_3.8.1_original.xapk >/dev/null

      - name: Extract XAPK
        run: |
          set -euxo pipefail
          mkdir xapk
          unzip -q Nebula_3.8.1_original.xapk -d xapk

      - name: Patch compatibility and disable forced app-update gate
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import zipfile, json, re
          from pathlib import Path

          # 1) Keep the v0.1 compatibility patch in the base APK.
          apk=Path("xapk/ai.nreal.nebula.universal.apk")
          tmp=apk.with_suffix(".patched.apk")
          found=[]
          changed=[]

          def patch_obj(o, path="root"):
              edits=0
              if isinstance(o, dict):
                  for k,v in list(o.items()):
                      kl=str(k).lower()
                      if k=="otherModel" and v is not True:
                          o[k]=True; edits+=1; changed.append(path+"."+str(k))
                      elif k=="versionCode" and str(v) in {"540","3.8.1","5124"}:
                          if str(v)!="5124":
                              o[k]=5124 if isinstance(v,int) else "5124"
                              edits+=1; changed.append(path+"."+str(k))
                      elif isinstance(v,(dict,list)):
                          edits += patch_obj(v, path+"."+str(k))
                      if isinstance(v,list) and ("model" in kl or "device" in kl):
                          if all(isinstance(x,str) for x in v) and v and "SM-S911N" not in v:
                              if any(re.match(r"SM-[A-Z0-9-]+$", x) for x in v):
                                  v.append("SM-S911N"); edits+=1; changed.append(path+"."+str(k)+"[+SM-S911N]")
              elif isinstance(o,list):
                  for i,v in enumerate(o):
                      if isinstance(v,(dict,list)):
                          edits += patch_obj(v, path+f"[{i}]")
              return edits

          with zipfile.ZipFile(apk,"r") as zin, zipfile.ZipFile(tmp,"w") as zout:
              for info in zin.infolist():
                  data=zin.read(info.filename)
                  if info.filename.lower().endswith("initdata.json"):
                      found.append(info.filename)
                      obj=json.loads(data.decode("utf-8-sig"))
                      patch_obj(obj, info.filename)
                      data=json.dumps(obj,ensure_ascii=False,separators=(",",":")).encode("utf-8")
                  if info.filename.startswith("META-INF/") and info.filename.upper().endswith((".RSA",".DSA",".EC",".SF",".MF")):
                      continue
                  zout.writestr(info,data)
          if not found:
              raise SystemExit("initData.json not found")
          tmp.replace(apk)
          print("Base patch:", changed)

          # 2) Disable only the mandatory Nebula APP version-check endpoint in Flutter AOT.
          #    Same-length replacement keeps the AOT string table layout intact.
          cfg=Path("xapk/config.arm64_v8a.apk")
          out=cfg.with_suffix(".patched.apk")
          old=b"/api/nebula/v1/isc/admin/software/version/check"
          new=b"/api/nebula/v1/isc/admin/software/version/chxxx"
          assert len(old)==len(new)
          patch_count=0

          with zipfile.ZipFile(cfg,"r") as zin, zipfile.ZipFile(out,"w") as zout:
              for info in zin.infolist():
                  data=zin.read(info.filename)
                  if info.filename=="lib/arm64-v8a/libapp.so":
                      n=data.count(old)
                      print("update endpoint occurrences:", n)
                      if n:
                          data=data.replace(old,new)
                          patch_count += n
                  if info.filename.startswith("META-INF/") and info.filename.upper().endswith((".RSA",".DSA",".EC",".SF",".MF")):
                      continue
                  zout.writestr(info,data)

          if patch_count < 1:
              raise SystemExit("Nebula app-update endpoint not found in libapp.so")
          out.replace(cfg)
          print("Forced app-update endpoint disabled, patches:", patch_count)
          PY

          unzip -t xapk/ai.nreal.nebula.universal.apk >/dev/null
          unzip -t xapk/config.arm64_v8a.apk >/dev/null

      - name: Install Android build tools
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Generate local test signing key
        run: |
          set -euxo pipefail
          keytool -genkeypair -v \
            -keystore nebula-air1-test.jks \
            -storepass nebulaair1 \
            -keypass nebulaair1 \
            -alias nebulaair1 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nebula Air1 Community Test,O=Community,C=KR"

      - name: Zipalign and sign all split APKs
        run: |
          set -euxo pipefail
          mkdir -p signed
          for apk in xapk/*.apk; do
            name="$(basename "$apk")"
            zipalign -f -p 4 "$apk" "signed/$name.aligned.apk"
            apksigner sign \
              --ks nebula-air1-test.jks \
              --ks-pass pass:nebulaair1 \
              --key-pass pass:nebulaair1 \
              --ks-key-alias nebulaair1 \
              --out "signed/$name" \
              "signed/$name.aligned.apk"
            rm "signed/$name.aligned.apk"
            apksigner verify --verbose "signed/$name"
          done

      - name: Rebuild XAPK
        run: |
          set -euxo pipefail
          cp xapk/manifest.json signed/manifest.json
          [ -f xapk/icon.png ] && cp xapk/icon.png signed/icon.png || true
          cd signed
          zip -0 -r ../Nebula_3.8.1_Air1_Mod_v0.2-test.xapk ./*
          cd ..
          unzip -t Nebula_3.8.1_Air1_Mod_v0.2-test.xapk >/dev/null
          sha256sum Nebula_3.8.1_Air1_Mod_v0.2-test.xapk | tee SHA256SUMS-v0.2.txt
          ls -lh Nebula_3.8.1_Air1_Mod_v0.2-test.xapk

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="nebula-air1-v0.2-test"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "Nebula_3.8.1_Air1_Mod_v0.2-test.xapk" \
            "SHA256SUMS-v0.2.txt" \
            --title "Nebula Air 1 Mod v0.2-test" \
            --prerelease \
            --notes "v0.2-test: keeps the Air 1 compatibility patch from v0.1 and disables Nebula's mandatory APP version-check endpoint in libapp.so using a same-length AOT string patch. This is intended to bypass the no-cancel forced update screen while preserving glasses firmware OTA and AR Space code. Experimental; on-device validation still required."
