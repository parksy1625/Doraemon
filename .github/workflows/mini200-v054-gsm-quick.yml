name: Mini-200 V0.5.4 GSM Quick

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mini200_ci/run_v054_gsm_quick.py'
      - '.github/workflows/mini200-v054-gsm-quick.yml'

permissions:
  actions: read
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      MODEL_ID: 'HuggingFaceTB/SmolLM2-135M-Instruct'
      INIT_SIDECAR: 'prev_artifact/mini200_ci_out/sidecar_fp16.pt'
      STEPS: '200'
      LR: '0.00012'
    steps:
      - uses: actions/checkout@v4
      - name: Download V0.5.3 500-step sidecar
        uses: actions/download-artifact@v4
        with:
          name: mini200-v053-results-3
          path: mini200_ci/prev_artifact
          run-id: 34258096613
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU deps
        run: |
          python -m pip install -U pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.48,<5' 'datasets>=3,<5' 'accelerate>=1,<2' 'safetensors>=0.4' 'huggingface_hub>=0.28'
      - name: Run quick GSM experiment
        working-directory: mini200_ci
        run: python run_v054_gsm_quick.py 2>&1 | tee quick.log
      - name: Upload quick results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini200-v054-gsm-quick-${{ github.run_number }}
          retention-days: 7
          compression-level: 1
          path: |
            mini200_ci/quick.log
            mini200_ci/mini200_quick_out/quick.json
            mini200_ci/mini200_quick_out/sidecar_quick.pt
